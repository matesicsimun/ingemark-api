spring:
  datasource:
    url: jdbc:h2:mem:products;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

hnb:
  api:
    base-url: http://localhost:0
    currency: USD
    connect-timeout: 1s
    read-timeout: 1s
