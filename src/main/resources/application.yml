spring:
  application:
    name: products-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ingemark
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

hnb:
  api:
    base-url: https://api.hnb.hr
    currency: USD
    connect-timeout: 5s
    read-timeout: 10s

logging:
  level:
    com.ingemark.products: INFO
